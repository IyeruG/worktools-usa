<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculadora de horas trabajadas con descansos y turnos que cruzan medianoche."><title>Calculadora de horas trabajadas | WorkTools USA</title><style>body{font-family:Arial,sans-serif;background:#f6f8fc;color:#132238;margin:0}.wrap{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 28px #0001;margin-top:18px}h1{font-size:2rem}p{color:#637187}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #dce3ed;border-radius:10px;box-sizing:border-box;font-size:1rem}button{width:100%;padding:14px;border:0;border-radius:10px;background:#155eef;color:#fff;font-weight:800;margin-top:16px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.result{display:none;margin-top:18px}.result.show{display:block}.back{color:#155eef;text-decoration:none;font-weight:700}</style></head><body><main class="wrap"><a class="back" href="index.html">← WorkTools USA</a><h1>Calculadora de horas trabajadas</h1><p>Calcula el tiempo trabajado restando tu descanso. También funciona con turnos que pasan de medianoche.</p><section class="card"><label for="start">Hora de entrada</label><input id="start" type="time"><label for="end">Hora de salida</label><input id="end" type="time"><label for="break">Descanso (minutos)</label><input id="break" type="number" min="0" max="1440" value="30"><button onclick="calc()">Calcular horas</button><div id="result" class="result"><div class="row"><span>Tiempo trabajado</span><b id="time"></b></div><div class="row"><span>Horas decimales</span><b id="decimal"></b></div></div></section></main><script>function calc(){if(!start.value||!end.value)return;let[a,b]=start.value.split(':').map(Number),[c,d]=end.value.split(':').map(Number),m=c*60+d-(a*60+b),br=+break.value;if(m<0)m+=1440;if(br<0||br>m)return;m-=br;time.textContent=Math.floor(m/60)+' h '+m%60+' min';decimal.textContent=(m/60).toFixed(2)+' h';result.classList.add('show')}</script></body></html>
