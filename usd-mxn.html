<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Conversor USD a MXN y MXN a USD con tipo de cambio editable."><title>Conversor USD MXN | WorkTools USA</title><style>body{font-family:Arial,sans-serif;background:#f6f8fc;color:#132238;margin:0}.wrap{max-width:680px;margin:auto;padding:24px 16px}.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 8px 28px #0001;margin-top:18px}h1{font-size:2rem}p{color:#637187}label{display:block;font-weight:700;margin:14px 0 6px}input,select{width:100%;padding:13px;border:1px solid #dce3ed;border-radius:10px;box-sizing:border-box;font-size:1rem}button{width:100%;padding:14px;border:0;border-radius:10px;background:#155eef;color:#fff;font-weight:800;margin-top:16px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.result{display:none;margin-top:18px}.result.show{display:block}.back{color:#155eef;text-decoration:none;font-weight:700}</style></head><body><main class="wrap"><a class="back" href="index.html">← WorkTools USA</a><h1>Conversor USD / MXN</h1><p>Convierte dólares a pesos mexicanos o pesos a dólares usando una tasa que puedes editar.</p><section class="card"><label for="amount">Monto</label><input id="amount" type="number" min="0" step="0.01" placeholder="100"><label for="direction">Conversión</label><select id="direction"><option value="usd">USD → MXN</option><option value="mxn">MXN → USD</option></select><label for="rate">1 USD = MXN</label><input id="rate" type="number" min="0.01" step="0.01" value="18.50"><button onclick="calc()">Convertir</button><div id="result" class="result"><div class="row"><span>Resultado</span><b id="output"></b></div><p>Esta versión usa la tasa que introduzcas; no consulta una tasa en tiempo real.</p></div></section></main><script>function calc(){let a=+amount.value,r=+rate.value;if(a<0||r<=0)return;let x=direction.value==='usd'?a*r:a/r;output.textContent=direction.value==='usd'?x.toLocaleString('es-MX',{style:'currency',currency:'MXN'}):x.toLocaleString('en-US',{style:'currency',currency:'USD'});result.classList.add('show')}</script></body></html>
