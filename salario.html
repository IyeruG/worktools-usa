<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculadora de salario por hora para estimar pago semanal, mensual y anual."><title>Calculadora de salario | WorkTools USA</title><style>body{font-family:Arial,sans-serif;background:#f6f8fc;color:#132238;margin:0}.wrap{max-width:680px;margin:auto;padding:24px 16px}.card{background:white;padding:22px;border-radius:18px;box-shadow:0 8px 28px #0001;margin-top:18px}h1{font-size:2rem}p{color:#637187}label{display:block;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #dce3ed;border-radius:10px;box-sizing:border-box;font-size:1rem}button{width:100%;padding:14px;border:0;border-radius:10px;background:#155eef;color:white;font-weight:800;margin-top:16px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.result{display:none;margin-top:18px}.result.show{display:block}.back{color:#155eef;text-decoration:none;font-weight:700}</style></head><body><main class="wrap"><a class="back" href="index.html">← WorkTools USA</a><h1>Calculadora de salario</h1><p>Calcula una estimación de tu salario bruto semanal, mensual y anual.</p><section class="card"><label for="rate">Pago por hora (USD)</label><input id="rate" type="number" min="0.01" step="0.01" placeholder="18.50"><label for="hours">Horas por semana</label><input id="hours" type="number" min="0" max="168" step="0.5" placeholder="40"><label><input id="ot" type="checkbox" style="width:auto"> Incluir overtime después de 40 horas</label><button onclick="calc()">Calcular salario</button><div id="result" class="result"><div class="row"><span>Horas normales</span><b id="regular"></b></div><div class="row"><span>Horas extra</span><b id="extra"></b></div><div class="row"><span>Pago semanal</span><b id="weekly"></b></div><div class="row"><span>Pago mensual aprox.</span><b id="monthly"></b></div><div class="row"><span>Pago anual</span><b id="annual"></b></div><p>Estimación bruta; no incluye impuestos ni deducciones.</p></div></section></main><script>const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});function calc(){let r=+rate.value,h=+hours.value;if(r<=0||h<0||h>168)return;let reg=ot.checked?Math.min(h,40):h,ex=ot.checked?Math.max(0,h-40):0,w=reg*r+ex*r*1.5;regular.textContent=reg.toFixed(1);extra.textContent=ex.toFixed(1);weekly.textContent=money(w);monthly.textContent=money(w*52/12);annual.textContent=money(w*52);result.classList.add('show')}</script></body></html>
